  <circle cx="800" cy="420" r="150" fill="#ffffff" fill-opacity="0.16"/>
  <text x="50%" y="440" font-size="150" text-anchor="middle" dominant-baseline="central">🏚️</text>
  <rect x="0" y="836" width="1600" height="64" fill="#1c1c14" fill-opacity="0.32"/>
  <text x="50%" y="870" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="600">Bâtiments de l'exploitation</text>
