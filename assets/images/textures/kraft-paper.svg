<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.015" numOctaves="4" seed="7" result="mottle"/>
      <feColorMatrix in="mottle" type="matrix"
        values="0 0 0 0 0.47
                0 0 0 0 0.36
                0 0 0 0 0.22
                0 0 0 1.1 -0.28" result="mottleColor"/>

      <feTurbulence type="fractalNoise" baseFrequency="0.75 0.85" numOctaves="2" seed="41" result="fiber"/>
      <feColorMatrix in="fiber" type="matrix"
        values="0 0 0 0 0.24
                0 0 0 0 0.17
                0 0 0 0 0.09
                0 0 0 1.4 -0.55" result="fiberColor"/>

      <feTurbulence type="fractalNoise" baseFrequency="0.75 0.85" numOctaves="2" seed="91" result="fiber2"/>
      <feColorMatrix in="fiber2" type="matrix"
        values="0 0 0 0 0.97
                0 0 0 0 0.89
                0 0 0 0 0.72
                0 0 0 1.4 -0.58" result="fiber2Color"/>

      <feMerge>
        <feMergeNode in="mottleColor"/>
        <feMergeNode in="fiberColor"/>
        <feMergeNode in="fiber2Color"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="440" height="440" fill="#c9a876"/>
  <rect width="440" height="440" filter="url(#grain)"/>
</svg>
